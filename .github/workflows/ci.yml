name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.22", "1.23"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: go version
        run: go version

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race -count=1 ./...

      - name: build binary
        run: go build -trimpath -o bin/agent-sidecar ./cmd/aggregator

      - name: smoke run (markdown)
        run: ./bin/agent-sidecar --input testdata/sample_runs --title "ci · smoke"

      - name: smoke run (json)
        run: ./bin/agent-sidecar --input testdata/sample_runs --format json | head -c 200

  lint:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: gofmt check
        run: |
          diff -u <(echo -n) <(gofmt -d .) && echo "gofmt ok"
